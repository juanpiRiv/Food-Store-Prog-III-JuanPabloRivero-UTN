<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>

  <body>
    <header>
      <h1>🍔 Food Store</h1>
      <nav id="nav-main"></nav>
    </header>

    <aside>
      <h2>Categorías</h2>
      <ul id="lista-categorias"></ul>
    </aside>

    <main>
      <div class="barra-filtros">
        <form id="form-buscar">
          <input
            id="input-buscar"
            type="search"
            placeholder="Buscar productos..."
            autocomplete="off"
          />
          <button type="submit">Buscar</button>
        </form>

        <div class="sort-row">
          <label for="select-orden">Ordenar:</label>
          <select id="select-orden">
            <option value="default">Por defecto</option>
            <option value="az">Nombre A-Z</option>
            <option value="za">Nombre Z-A</option>
            <option value="precio-asc">Precio menor a mayor</option>
            <option value="precio-desc">Precio mayor a menor</option>
          </select>
        </div>
      </div>

      <div class="resultados-header">
        <h2>Productos</h2>
        <span id="contador-resultados" class="contador-resultados"></span>
      </div>

      <section id="contenedor-productos"></section>
    </main>

    <footer>
      <p>© 2024 Food Store</p>
    </footer>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
